                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&

function expiryPurchase(p){const d=dateAt(p.date);d.setFullYear(d.getFullYear()+1);return d;}
function expiredPurchase(p){return now()>=expiryPurchase(p);}
function effectivePaid(p){return Math.max(0,dec(p.paid-(p.refund||0)))}
function tierPoints(){return dec(state.purchases.filter(p=>!expiredPurchase(p)).reduce((s,p)=>s+effectivePaid(p),0))}
function fishEarned(){return state.purchases.reduce((s,p)=>s+Math.floor((cents(effectivePaid(p))+0.00001)/1000),0)}
function fishBalance(){return fishEarned()-state.fishClaims.reduce((s,c)=>s+c.cost,0)+(state.fishManualCorrections||[]).reduce((s,x)=>s+x.delta,0)}
function tierByPoints(pts){return [...state.tiers].reverse().find(x=>pts>=x.min)||state.tiers[0]}
function tierIndex(pts){return state.tiers.findIndex(x=>x===tierByPoints(pts))}
function nextTier(pts){return state.tiers.find(x=>x.min>pts)||null}
function percentProgress(pts){const cur=tierByPoints(pts),nxt=nextTier(pts);if(!nxt)return 100;return Math.max(0,Math.min(100,100*(pts-cur.min)/(nxt.min-cur.min)))}

function getReward(id){return state.rewards.find(r=>r.id===id)}

function ownClaims(r){return state.fishClaims.filter(c=>c.rewardId===r.id)}

 ${adminTab==='sale'?saleAdmin():adminTab==='redeem'?redeemAdmin():adminTab==='rewards'?rewardsAdmin():adminTab==='tiers'?tiersAdmin():returnsAdmin()}
 <div class="notice redish mt16">To tylko symulator. Bez logowania, centralnej bazy i integracji Subiekt GT nie można bezpiecznie przyznawać klientom punktów ani egzekwować limitów globalnych.</div>`}
function saleAdmin(){const vouchers=activeVouchers();return `<div class="panel"><div class="label">KARTA KLIENTA · CR-000001</div><div class="row mt8"><div><b>${esc(tierByPoints(tierPoints()).name)}</b><div class="fine">${pointsText(tierPoints())} · rabat ${tierByPoints(tierPoints()).discount}%</div></div><div class="chip gray">🐟 ${fishBalance()} ryb</div></div></div>
 <div class="panel"><h3 style="margin:0">Dodaj zakup stacjonarny</h3><p class="fine">Wpisz ceny przed rabatem lojalnościowym. Produkty promocyjne już wpisujesz po ich przecenie.</p><label class="field-label" for="sale-regular">Suma produktów w cenach regularnych (zł)</label><input id="sale-regular" class="field" inputmode="decimal" type="number" min="0" step="0.01" value="${esc(ui.saleRegular)}" data-sale="regular"><label class="field-label" for="sale-promo">Suma produktów promocyjnych (zł)</label><input id="sale-promo" class="field" inputmode="decimal" type="number" min="0" step="0.01" value="${esc(ui.salePromo)}" data-sale="promo">
 ${vouchers.length?`<label class="field-label">Wykorzystaj otrzymane bony (można wybrać kilka)</label>${vouchers.map(c=>`<label class="check"><input type="checkbox" data-coupon="${esc(c.code)}" ${ui.selectedCodes.includes(c.code)?'checked':''}>${esc(c.title)} · −${cash(c.value)} <span class="fine">${esc(c.code)}</span></label>`).join('')}`:'<p class="fine mt12">Brak aktywnych bonów — odbierz je wcześniej w zakładce „Nagrody”.</p>'}
 <div id="sale-preview">${salePreview()}</div><button class="primary block mt12" data-action="purchase">✓ Zatwierdź zakup demonstracyjny</button><p class="fine">Rabat dotyczy tylko produktów regularnych. Bony pomniejszają łączną kwotę po rabacie. System dobiera najwyższy poziom możliwy do uzyskania już podczas zakupu.</p></div>`}
function redeemAdmin(){return `<div class="panel"><h3 style="margin:0">Sprawdź kod nagrody</h3><p class="fine">Wpisz kod tekstowy pod QR klienta. W prawdziwej aplikacji sprzedawca zeskanuje go czytnikiem.</p><label class="field-label">Kod nagrody</label><input class="field" id="lookup-code" placeholder="Np. CR-REW-..." value="${esc(ui.lookup)}" data-lookup><button class="secondary block mt12" data-action="lookup">Zweryfikuj kod</button><div id="lookup-result"></div></div>
 <div class="panel"><b>Ostatnie wymiany</b>${[...state.fishClaims].reverse().slice(0,10).map(c=>`<div class="history-row"><div class="row"><div class="grow"><b>${esc(c.title)}</b><div class="fine code">${esc(c.code)}</div></div><span class="chip ${claimStatus(c)==='ready'?'green':'gray'}">${readableClaimStatus(c)}</span></div></div>`).join('')||'<p class="fine">Brak wymian.</p>'}</div>`}
function lookupResult(code){const c=state.fishClaims.find(x=>x.code.toUpperCase()===code.trim().toUpperCase());if(!c)return '<div class="notice redish mt12">Nie znaleziono kodu. Sprawdź jego poprawność.</div>';const stat=claimStatus(c);return `<div class="notice ${stat==='ready'?'good':'redish'} mt12"><b>${esc(c.title)}</b><div class="fine code mt8">${esc(c.code)}</div><div class="mt8">Status: <b>${readableClaimStatus(c)}</b></div>${stat==='ready'?`<button class="primary block mt12" data-action="mark-used" data-code="${esc(c.code)}">Oznacz jako wykorzystaną</button>`:'<p class="fine">Tego kodu nie można zrealizować ponownie.</p>'}</div>`}
function rewardsAdmin(){return `<div class="panel"><div class="row"><h3 style="margin:0">Katalog nagród</h3><button class="primary" data-action="new-reward">+ Dodaj</button></div><div class="fine mt8">Zmiany w nagrodach wpływają na widok klienta w tej przeglądarce.</div>${state.rewards.map(r=>`<div class="history-row"><div class="row"><div class="grow"><b>${esc(r.emoji)} ${esc(r.title)}</b><div class="fine">${r.cost} ryb · ${esc(perAccountLabel(r))}</div><div class="fine">Globalnie: ${r.globalLimit===null?'bez limitu':globalLeft(r)+' z '+r.globalLimit} · ${r.active?'Aktywna':'Wyłączona'}</div></div><button class="tiny-btn" data-action="edit-reward" data-id="${esc(r.id)}">Edytuj</button></div></div>`).join('')}</div>${ui.draft?rewardForm():''}`}
function rewardForm(){const d=ui.draft;return `<div class="panel" id="reward-form"><h3 style="margin-top:0">${ui.editId?'Edytuj nagrodę':'Nowa nagroda'}</h3>
 <label class="field-label">Nazwa nagrody</label><input class="field" data-draft="title" value="${esc(d.title)}" placeholder="Np. Bon na 10 zł"><label class="field-label">Opis</label><textarea class="field" data-draft="description" rows="3">${esc(d.description)}</textarea><div class="fields2"><div><label class="field-label">Koszt w rybach</label><input class="field" type="number" min="1" step="1" data-draft="cost" value="${esc(d.cost)}"></div><div><label class="field-label">Ikona / emoji</label><input class="field" data-draft="emoji" value="${esc(d.emoji)}"></div></div>
 <div class="fields2"><div><label class="field-label">Rodzaj</label><select class="field" data-draft="kind">${[['voucher','Bon kwotowy'],['product','Produkt / nagroda'],['bonus','Bonus / usługa']].map(([k,v])=>`<option value="${k}" ${d.kind===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="field-label">Kwota bonu (zł)</label><input class="field" type="number" min="0" step="0.01" data-draft="value" value="${esc(d.value)}"></div></div>
 <label class="field-label">Zdjęcie nagrody (opcjonalnie)</label><input class="field" style="padding:10px" type="file" accept="image/png,image/jpeg,image/webp" data-reward-photo><p id="reward-img-preview" class="fine">${d.imageData?"✓ Dodano zdjęcie nagrody":"Możesz wgrać zdjęcie z telefonu lub komputera. Zostanie pomniejszone do wersji demo."}</p>
 <hr class="divider"><b>Limit na jedno konto</b><label class="field-label">Rodzaj limitu</label><select class="field" data-draft="perAccount"><option value="unlimited" ${d.perAccount==='unlimited'?'selected':''}>Bez limitu</option><option value="lifetime" ${d.perAccount==='lifetime'?'selected':''}>1 raz na całe konto</option><option value="period" ${d.perAccount==='period'?'selected':''}>X razy w ciągu Y dni</option></select><div class="fields2"><div><label class="field-label">Liczba wymian (X)</label><input class="field" type="number" min="1" step="1" data-draft="limitCount" value="${esc(d.limitCount)}"></div><div><label class="field-label">Okres w dniach (Y)</label><input class="field" type="number" min="1" step="1" data-draft="limitDays" value="${esc(d.limitDays)}"></div></div>
 <hr class="divider"><b>Limit globalny</b><label class="field-label">Łączna pula (puste = bez limitu)</label><input class="field" type="number" min="1" step="1" data-draft="globalLimit" placeholder="Np. 10" value="${d.globalLimit===null?'':esc(d.globalLimit)}"><p class="fine">Wydana sztuka nie wraca do puli, nawet gdy nagroda wygaśnie.</p><label class="field-label">Ważność po wymianie w dniach (puste = bezterminowo)</label><input class="field" type="number" min="1" step="1" data-draft="validDays" placeholder="Np. 30" value="${d.validDays===null?'':esc(d.validDays)}"><label class="check"><input type="checkbox" data-draft-check="active" ${d.active?'checked':''}>Nagroda aktywna i widoczna w katalogu</label>
 <button class="primary block mt12" data-action="save-reward">Zapisz nagrodę</button><button class="secondary block mt8" data-action="cancel-edit">Anuluj</button></div>`}
function tiersAdmin(){return `<div class="panel"><h3 style="margin-top:0">Poziomy i rabaty</h3><p class="fine">W tym demo możesz edytować nazwy poziomów, wymagane punkty i rabaty. Nie przeliczamy wstecz starych paragonów.</p>${state.tiers.map((t,i)=>`<div class="history-row"><b>${TIER_EMOJI[i]} Próg ${i+1}</b><label class="field-label">Nazwa</label><input class="field" id="tier-name-${i}" value="${esc(t.name)}"><div class="fields2"><div><label class="field-label">Punkty od</label><input class="field" type="number" min="0" step="1" id="tier-min-${i}" value="${t.min}" ${i===0?'readonly':''}></div><div><label class="field-label">Rabat (%)</label><input class="field" type="number" min="0" max="100" step="0.01" id="tier-disc-${i}" value="${t.discount}"></div></div></div>`).join('')}<button class="primary block mt12" data-action="save-tiers">Zapisz zmiany progów</button></div>`}
function returnsAdmin(){const eligible=[...state.purchases].reverse();return `<div class="panel"><h3 style="margin-top:0">Zwrot towaru — demo</h3><p class="fine">Wybierz paragon i wpisz kwotę zwrotu. Punkty oraz ryby za ten paragon zostaną skorygowane. Jeżeli klient już wydał ryby, może powstać ujemne saldo (dług ryb).</p>${eligible.length?`<label class="field-label">Paragon</label><select class="field" id="refund-purchase">${eligible.map(p=>`<option value="${esc(p.id)}">${esc(p.id)} · ${formatDate(dateAt(p.date))} · pozostało ${cash(effectivePaid(p))}</option>`).join('')}</select><label class="field-label">Kwota zwrotu (zł)</label><input class="field" id="refund-amount" type="number" min="0.01" step="0.01" placeholder="Np. 50.00"><button class="secondary block mt12" data-action="refund">↩ Potwierdź zwrot demonstracyjny</button>`:'<div class="empty">Brak zakupów.</div>'}</div>`}
function render(){const pages={start:startPage,karta:kartaPage,nagrody:fishRewardPage,'moje-nagrody':myRewardsPage,historia:historiaPage,promocje:promocjePage,konto:kontoPage,admin:adminPage};document.getElementById('app').innerHTML=(pages[tab]||pages.start)();const tabForNav=['moje-nagrody'].includes(tab)?'nagrody':['historia'].includes(tab)?'karta':tab==='admin'?'konto':tab;document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.go===tabForNav));}
function go(target){tab=target;render();window.scrollTo(0,0)}
function generateCode(){return 'CR-REW-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}
function claimReward(id){const r=getReward(id);if(!r||!r.active)return alert('Nagroda jest niedostępna.');if(fishBalance()<r.cost)return alert('Nie masz wystarczającej liczby ryb.');if(limitInfo(r).blocked)return alert('Osiągnięto limit na konto.');const left=globalLeft(r);if(left!==null&&left<=0)return alert('Wyczerpano limit globalny.');if(!confirm(`Wymienić ${r.cost} ryb na „${r.title}”? Wydane ryby nie wrócą, nawet gdy nagroda wygaśnie.`))return;
 // All checks repeated for this browser demo; production needs atomic server-side transaction.
 if(fishBalance()<r.cost||limitInfo(r).blocked||(globalLeft(r)!==null&&globalLeft(r)<=0))return alert('Nagroda jest niedostępna.');
 state.fishClaims.push({id:'C'+Date.now(),rewardId:r.id,title:r.title,kind:r.kind,value:r.kind==='voucher'?r.value:0,cost:r.cost,code:generateCode(),createdAt:new Date().toISOString(),validDays:r.validDays,usedAt:null});save();go('moje-nagrody');}
function useCode(code){const c=state.fishClaims.find(x=>x.code===code);if(!c||claimStatus(c)!=='ready')return alert('Kod jest nieprawidłowy, wygasł albo był już użyty.');if(!confirm(`Oznaczyć „${c.title}” jako wykorzystaną nagrodę?`))return;c.usedAt=new Date().toISOString();save();render();}
function processPurchase(){const c=checkout();if(c.error)return alert(c.error);if(!confirm(`Zatwierdzić testowy zakup ${cash(c.paid)} i przyznać ${pointsText(c.points)} oraz ${c.fish} ryb?`))return;
 if(c.codes.some(x=>claimStatus(x)!=='ready'))return alert('Jeden z wybranych bonów jest nieaktywny.');
 const id='P-'+state.nextPurchase++;state.purchases.push({id,date:isoDate(now()),regular:c.R,promo:c.M,discount:c.discAmount,voucher:c.V,paid:c.paid,refund:0,description:'Zakup demonstracyjny'});c.codes.forEach(x=>x.usedAt=new Date().toISOString());ui.selectedCodes=[];save();alert(`Zapisano paragon ${id}. Dodano ${pointsText(c.points)} i ${c.fish} ryb.`);render();}
function processRefund(){const p=state.purchases.find(x=>x.id===document.getElementById('refund-purchase')?.value),input=Number(document.getElementById('refund-amount')?.value);if(!p||!Number.isFinite(input)||input<=0)return alert('Wpisz poprawną kwotę zwrotu.');const amount=dec(input);if(amount>effectivePaid(p))return alert('Kwota zwrotu nie może przekroczyć pozostałej wartości paragonu.');if(!confirm(`Skorygować paragon ${p.id} o ${cash(amount)}?`))return;p.refund=dec((p.refund||0)+amount);p.refundDate=isoDate(now());save();render();}
function createDraft(r){return r?{...r}:{id:'R'+Date.now(),title:'',kind:'voucher',value:10,cost:50,emoji:'🎁',description:'',perAccount:'unlimited',limitCount:1,limitDays:30,globalLimit:null,validDays:null,active:true}}
function saveReward(){const d=ui.draft;if(!d)return;if(!d.title.trim())return alert('Podaj nazwę nagrody.');const cost=+d.cost,limitCount=+d.limitCount,limitDays=+d.limitDays,value=+d.value;if(!Number.isInteger(cost)||cost<1)return alert('Koszt w rybach musi być dodatnią liczbą całkowitą.');if(!Number.isInteger(limitCount)||limitCount<1||!Number.isInteger(limitDays)||limitDays<1)return alert('Niepoprawne limity na konto.');if(d.kind==='voucher'&&(!Number.isFinite(value)||value<=0))return alert('Podaj dodatnią wartość bonu.');if(d.globalLimit!==null&&(!Number.isInteger(+d.globalLimit)||+d.globalLimit<1))return alert('Globalna pula musi być dodatnią liczbą całkowitą.');if(d.validDays!==null&&(!Number.isInteger(+d.validDays)||+d.validDays<1))return alert('Ważność nagrody musi być dodatnią liczbą całkowitą.');
 const claimed=state.fishClaims.filter(c=>c.rewardId===d.id).length;if(d.globalLimit!==null&&+d.globalLimit<claimed)return alert(`Limit globalny nie może być mniejszy niż liczba już wydanych nagród (${claimed}).`);
 d.cost=cost;d.value=dec(value);d.limitCount=limitCount;d.limitDays=limitDays;d.globalLimit=d.globalLimit===null?null:+d.globalLimit;d.validDays=d.validDays===null?null:+d.validDays;d.title=d.title.trim();d.description=d.description.trim();d.emoji=d.emoji||'🎁';
 if(ui.editId){const idx=state.rewards.findIndex(r=>r.id===ui.editId);if(idx>=0)state.rewards[idx]=d}else state.rewards.push(d);ui.draft=null;ui.editId=null;save();render();alert('Zapisano nagrodę w demonstracyjnym katalogu.');}
function saveTiers(){const tiers=[];for(let i=0;i<5;i++){const name=document.getElementById('tier-name-'+i).value.trim(),min=Number(document.getElementById('tier-min-'+i).value),discount=Number(document.getElementById('tier-disc-'+i).value);if(!name||!Number.isInteger(min)||min<0||!Number.isFinite(discount)||discount<0||discount>100)return alert('Sprawdź nazwy, punkty i rabaty.');if(i===0&&min!==0)return alert('Pierwszy poziom musi zaczynać się od zera.');if(i>0&&min<=tiers[i-1].min)return alert('Kolejne poziomy muszą mieć rosnącą liczbę punktów.');tiers.push({name,min,discount})}state.tiers=tiers;save();render();alert('Zapisano progi w demonstracyjnym programie.');}
function updatePreview(){const el=document.getElementById('sale-preview');if(el)el.innerHTML=salePreview()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-go],[data-admin],[data-action]');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.admin){adminTab=b.dataset.admin;render();return}const action=b.dataset.action;
 if(action==='claim')claimReward(b.dataset.id);
 else if(action==='copy'){try{await navigator.clipboard.writeText(b.dataset.code);alert('Skopiowano kod nagrody.')}catch(e){prompt('Skopiuj kod:',b.dataset.code)}}
 else if(action==='reset'){if(confirm('Czy na pewno usunąć wszystkie testowe operacje i przywrócić przykładowe dane?')){state=fresh();ui={selectedCodes:[],saleRegular:'300',salePromo:'100',lookup:'',editId:null,draft:null};save();go('start')}}
 else if(action==='purchase')processPurchase();else if(action==='refund')processRefund();
 else if(action==='lookup'){const el=document.getElementById('lookup-result');if(el)el.innerHTML=lookupResult(ui.lookup)}
 else if(action==='mark-used')useCode(b.dataset.code);
 else if(action==='new-reward'){ui.editId=null;ui.draft=createDraft();render();document.getElementById('reward-form')?.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(action==='edit-reward'){ui.editId=b.dataset.id;ui.draft=createDraft(getReward(ui.editId));render();document.getElementById('reward-form')?.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(action==='save-reward')saveReward();else if(action==='cancel-edit'){ui.editId=null;ui.draft=null;render()}
 else if(action==='save-tiers')saveTiers();
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.sale==='regular'){ui.saleRegular=el.value;updatePreview()}if(el.dataset.sale==='promo'){ui.salePromo=el.value;updatePreview()}if(el.hasAttribute('data-lookup'))ui.lookup=el.value;if(el.hasAttribute('data-draft')&&ui.draft){const k=el.dataset.draft;ui.draft[k]=(k==='globalLimit'||k==='validDays')?(el.value===''?null:el.value):el.value;}});
document.addEventListener('change',e=>{const el=e.target;if(el.hasAttribute('data-reward-photo')){const f=el.files&&el.files[0];if(f&&ui.draft){if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>8000000){alert('Wybierz zdjęcie JPG, PNG lub WebP o wielkości do 8 MB.');return}const u=URL.createObjectURL(f),pic=new Image();pic.onload=()=>{try{const cnv=document.createElement('canvas'),scale=Math.min(1,360/Math.max(pic.width,pic.height));cnv.width=Math.max(1,Math.round(pic.width*scale));cnv.height=Math.max(1,Math.round(pic.height*scale));cnv.getContext('2d').drawImage(pic,0,0,cnv.width,cnv.height);ui.draft.imageData=cnv.toDataURL('image/jpeg',0.75);const q=document.getElementById('reward-img-preview');if(q)q.textContent='✓ Zdjęcie dodane do nagrody. Zapisz nagrodę.';}catch(e){alert('Nie udało się odczytać zdjęcia.')}finally{URL.revokeObjectURL(u)}};pic.onerror=()=>{URL.revokeObjectURL(u);alert('Nie udało się otworzyć zdjęcia.')};pic.src=u;}return}if(el.hasAttribute('data-coupon')){ui.selectedCodes=el.checked?[...new Set([...ui.selectedCodes,el.dataset.coupon])]:ui.selectedCodes.filter(x=>x!==el.dataset.coupon);updatePreview()}if(el.hasAttribute('data-draft-check')&&ui.draft)ui.draft[el.dataset.draftCheck]=el.checked;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-go]'))go(e.target.dataset.go)});
render();

</script>
</body></html>
