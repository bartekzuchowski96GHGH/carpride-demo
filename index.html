/* v3 · Light, high-contrast customer screens. Admin stays dark. */
.brand-image{display:none}
body.customer-light{--bg:#f2f4f7;--surface:#fff;--surface2:#f7f8fa;--border:#d4dae2;--red:#df1028;--red2:#c51b2d;--txt:#1a2130;--muted:#697281;--green:#148154;--gold:#a57a28;--warn:#a2620d;background:var(--bg);color:var(--txt)}
body.customer-light main{max-width:670px;padding:17px 16px 112px}
body.customer-light header{padding:4px 0 0;margin:0 0 23px;gap:8px}
body.customer-light .brand-text{display:none}
body.customer-light .brand-image{display:block;width:180px;height:87px;object-fit:contain;object-position:left center}
body.customer-light header .sub{letter-spacing:1.45px;font-size:9px;color:#656e7c;max-width:175px}
body.customer-light header .tag{background:#fff;border:1.5px solid #e11930;color:#c7192c;border-radius:12px;font-size:10px;padding:8px 9px;line-height:1.1;white-space:nowrap}

body.customer-light .demo-stamp{border-color:#dfc2c5;color:#95515a;background:#fff}
body.customer-light .foot{color:#89929e}
body.customer-light .panel{background:white;border-color:#d7dee7;box-shadow:0 5px 16px #1a29450b}
body.customer-light .fine,body.customer-light .muted,body.customer-light .tier-range{color:#717b88}
body.customer-light .secondary{background:#fff;color:#242f3d;border-color:#cdd4df}
body.customer-light .primary{background:#df1028;border-color:#df1028;color:white}
body.customer-light .notice{background:#fff;color:#555f6d;border-color:#d9dfe8}
body.customer-light .chip{color:#bb2838;background:#fff0f1;border-color:#f0cbd2}

body.customer-light .chip.green{color:#14774d;background:#ecfaf3;border-color:#bfead7}

body.customer-light .page-intro{color:#687380}
body.customer-light .label{color:#7a8390}
body.customer-light .qr{border:1px solid #e8ebef;box-shadow:0 4px 22px #10254117}
body.customer-light .reward-card{background:#fff}

/* v4 · Home page matches the approved light card/rewards style. */
.v4-home{color:#202838;padding-bottom:8px}

.v4-head{margin:1px 0 19px}

.v4-fish-top{display:flex;align-items:center;gap:14px}
.v4-fish-icon{width:62px;height:62px;border-radius:17px;background:#fff0f2;color:#d30c2a;display:grid;place-items:center;flex:0 0 auto}

function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;

		}

};

var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );

    },

        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;

        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

module.exports = QRUtil;

function ownClaims(r){return state.fishClaims.filter(c=>c.rewardId===r.id)}
function limitInfo(r){const all=ownClaims(r);if(r.perAccount==='lifetime')return {blocked:all.length>=1,expires:null};if(r.perAccount==='period'){
 const days=Math.max(1,+r.limitDays||30),max=Math.max(1,+r.limitCount||1),active=all.filter(c=>now()<shiftDays(new Date(c.createdAt),days)).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
 if(active.length>=max)return {blocked:true,expires:shiftDays(new Date(active[active.length-max].createdAt),days)};
 }return {blocked:false,expires:null};}
function perAccountLabel(r){if(r.perAccount==='lifetime')return '1 szt. na konto · na zawsze';if(r.perAccount==='period')return `Maks. ${r.limitCount} szt. na ${r.limitDays} dni / konto`;return 'Bez limitu na konto'}
function readableClaimStatus(c){return claimStatus(c)==='ready'?'Do wykorzystania':claimStatus(c)==='used'?'Wykorzystana':'Wygasła'}
function htmlQR(value){try{const qr=new QRCode(-1,1);qr.addData(value);qr.make();const n=qr.getModuleCount();let rects='';for(let y=0;y<n;y++){for(let x=0;x<n;x++){if(qr.isDark(y,x))rects+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}}return `<div class="qr" aria-label="Kod QR nagrody"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 ${n+6} ${n+6}" role="img" aria-label="Kod QR ${esc(value)}"><rect x="-3" y="-3" width="${n+6}" height="${n+6}" fill="white"/><g fill="#101014">${rects}</g></svg></div>`}catch(e){return `<div class="qr-slot"><b>Tu będzie kod QR</b><div class="code">${esc(value)}</div></div>`}}
function levelBadge(pts){const tier=tierByPoints(pts);return `<span class="chip">${TIER_EMOJI[tierIndex(pts)]||'🎣'} ${esc(tier.name)}</span>`}
function head(title,intro=''){return `<h1 class="title">${title}</h1>${intro?`<p class="page-intro">${intro}</p>`:''}`}
function startPage(){const pts=tierPoints(),fish=fishBalance(),tier=tierByPoints(pts);const ready=state.fishClaims.filter(c=>claimStatus(c)==='ready').length;return `

 </div>`}

function rewardDetails(r,left,limit){
 let out='';
 if(r.perAccount==='lifetime')out+=`<span class="v3-rule"><span class="v3-rule-symbol">♙</span>1 szt. na konto</span>`;
 if(r.perAccount==='period')out+=`<span class="v3-rule"><span class="v3-rule-symbol">♙</span>${esc(r.limitCount)} szt. na konto / ${esc(r.limitDays)} dni</span>`;
 if(left!==null)out+=`<span class="v3-rule"><span class="v3-rule-symbol">◉</span>Limit globalny: ${r.globalLimit} szt. <b>· Pozostało ${left} z ${r.globalLimit}</b></span>`;

 for(const tier of ranked){const disc=dec(R*tier.discount/100),total=dec(R+M-disc);const result=dec(total-V);if(result<0)continue;if(P+result+1e-8>=tier.min){chosen=tier;paid=result;discAmount=disc;break}}
 if(!chosen){const t=state.tiers[0];const d=dec(R*t.discount/100);if(dec(R+M-d)<V)return {error:'Wybrane bony przekraczają kwotę zakupów po rabacie. Odznacz część bonów.'};chosen=t;paid=dec(R+M-d-V);discAmount=d;}

 // All checks repeated for this browser demo; production needs atomic server-side transaction.
 if(fishBalance()<r.cost||limitInfo(r).blocked||(globalLeft(r)!==null&&globalLeft(r)<=0))return alert('Nagroda jest niedostępna.');
 state.fishClaims.push({id:'C'+Date.now(),rewardId:r.id,title:r.title,kind:r.kind,value:r.kind==='voucher'?r.value:0,cost:r.cost,code:generateCode(),createdAt:new Date().toISOString(),validDays:r.validDays,usedAt:null});save();go('moje-nagrody');}
function useCode(code){const c=state.fishClaims.find(x=>x.code===code);if(!c||claimStatus(c)!=='ready')return alert('Kod jest nieprawidłowy, wygasł albo był już użyty.');if(!confirm(`Oznaczyć „${c.title}” jako wykorzystaną nagrodę?`))return;c.usedAt=new Date().toISOString();save();render();}
function processPurchase(){const c=checkout();if(c.error)return alert(c.error);if(!confirm(`Zatwierdzić testowy zakup ${cash(c.paid)} i przyznać ${pointsText(c.points)} oraz ${c.fish} ryb?`))return;
 if(c.codes.some(x=>claimStatus(x)!=='ready'))return alert('Jeden z wybranych bonów jest nieaktywny.');
 const id='P-'+state.nextPurchase++;state.purchases.push({id,date:isoDate(now()),regular:c.R,promo:c.M,discount:c.discAmount,voucher:c.V,paid:c.paid,refund:0,description:'Zakup demonstracyjny'});c.codes.forEach(x=>x.usedAt=new Date().toISOString());ui.selectedCodes=[];save();alert(`Zapisano paragon ${id}. Dodano ${pointsText(c.points)} i ${c.fish} ryb.`);render();}
function processRefund(){const p=state.purchases.find(x=>x.id===document.getElementById('refund-purchase')?.value),input=Number(document.getElementById('refund-amount')?.value);if(!p||!Number.isFinite(input)||input<=0)return alert('Wpisz poprawną kwotę zwrotu.');const amount=dec(input);if(amount>effectivePaid(p))return alert('Kwota zwrotu nie może przekroczyć pozostałej wartości paragonu.');if(!confirm(`Skorygować paragon ${p.id} o ${cash(amount)}?`))return;p.refund=dec((p.refund||0)+amount);p.refundDate=isoDate(now());save();render();}
function createDraft(r){return r?{...r}:{id:'R'+Date.now(),title:'',kind:'voucher',value:10,cost:50,emoji:'🎁',description:'',perAccount:'unlimited',limitCount:1,limitDays:30,globalLimit:null,validDays:null,active:true}}
function saveReward(){const d=ui.draft;if(!d)return;if(!d.title.trim())return alert('Podaj nazwę nagrody.');const cost=+d.cost,limitCount=+d.limitCount,limitDays=+d.limitDays,value=+d.value;if(!Number.isInteger(cost)||cost<1)return alert('Koszt w rybach musi być dodatnią liczbą całkowitą.');if(!Number.isInteger(limitCount)||limitCount<1||!Number.isInteger(limitDays)||limitDays<1)return alert('Niepoprawne limity na konto.');if(d.kind==='voucher'&&(!Number.isFinite(value)||value<=0))return alert('Podaj dodatnią wartość bonu.');if(d.globalLimit!==null&&(!Number.isInteger(+d.globalLimit)||+d.globalLimit<1))return alert('Globalna pula musi być dodatnią liczbą całkowitą.');if(d.validDays!==null&&(!Number.isInteger(+d.validDays)||+d.validDays<1))return alert('Ważność nagrody musi być dodatnią liczbą całkowitą.');
 const claimed=state.fishClaims.filter(c=>c.rewardId===d.id).length;if(d.globalLimit!==null&&+d.globalLimit<claimed)return alert(`Limit globalny nie może być mniejszy niż liczba już wydanych nagród (${claimed}).`);
 d.cost=cost;d.value=dec(value);d.limitCount=limitCount;d.limitDays=limitDays;d.globalLimit=d.globalLimit===null?null:+d.globalLimit;d.validDays=d.validDays===null?null:+d.validDays;d.title=d.title.trim();d.description=d.description.trim();d.emoji=d.emoji||'🎁';
 if(ui.editId){const idx=state.rewards.findIndex(r=>r.id===ui.editId);if(idx>=0)state.rewards[idx]=d}else state.rewards.push(d);ui.draft=null;ui.editId=null;save();render();alert('Zapisano nagrodę w demonstracyjnym katalogu.');}
function saveTiers(){const tiers=[];for(let i=0;i<5;i++){const name=document.getElementById('tier-name-'+i).value.trim(),min=Number(document.getElementById('tier-min-'+i).value),discount=Number(document.getElementById('tier-disc-'+i).value);if(!name||!Number.isInteger(min)||min<0||!Number.isFinite(discount)||discount<0||discount>100)return alert('Sprawdź nazwy, punkty i rabaty.');if(i===0&&min!==0)return alert('Pierwszy poziom musi zaczynać się od zera.');if(i>0&&min<=tiers[i-1].min)return alert('Kolejne poziomy muszą mieć rosnącą liczbę punktów.');tiers.push({name,min,discount})}state.tiers=tiers;save();render();alert('Zapisano progi w demonstracyjnym programie.');}
function updatePreview(){const el=document.getElementById('sale-preview');if(el)el.innerHTML=salePreview()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-go],[data-admin],[data-action],[data-filter]');if(!b)return;if(b.hasAttribute('data-filter')){ui.rewardFilter=b.dataset.filter;render();return}if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.admin){adminTab=b.dataset.admin;render();return}const action=b.dataset.action;
 if(action==='claim')claimReward(b.dataset.id);
 else if(action==='copy'){try{await navigator.clipboard.writeText(b.dataset.code);alert('Skopiowano kod nagrody.')}catch(e){prompt('Skopiuj kod:',b.dataset.code)}}
 else if(action==='reset'){if(confirm('Czy na pewno usunąć wszystkie testowe operacje i przywrócić przykładowe dane?')){state=fresh();ui={selectedCodes:[],saleRegular:'300',salePromo:'100',lookup:'',editId:null,draft:null,rewardFilter:'all'};save();go('start')}}
 else if(action==='purchase')processPurchase();else if(action==='refund')processRefund();
 else if(action==='lookup'){const el=document.getElementById('lookup-result');if(el)el.innerHTML=lookupResult(ui.lookup)}
 else if(action==='mark-used')useCode(b.dataset.code);
 else if(action==='new-reward'){ui.editId=null;ui.draft=createDraft();render();document.getElementById('reward-form')?.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(action==='edit-reward'){ui.editId=b.dataset.id;ui.draft=createDraft(getReward(ui.editId));render();document.getElementById('reward-form')?.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(action==='save-reward')saveReward();else if(action==='cancel-edit'){ui.editId=null;ui.draft=null;render()}
 else if(action==='save-tiers')saveTiers();
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.sale==='regular'){ui.saleRegular=el.value;updatePreview()}if(el.dataset.sale==='promo'){ui.salePromo=el.value;updatePreview()}if(el.hasAttribute('data-lookup'))ui.lookup=el.value;if(el.hasAttribute('data-draft')&&ui.draft){const k=el.dataset.draft;ui.draft[k]=(k==='globalLimit'||k==='validDays')?(el.value===''?null:el.value):el.value;}});
document.addEventListener('change',e=>{const el=e.target;if(el.hasAttribute('data-reward-photo')){const f=el.files&&el.files[0];if(f&&ui.draft){if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>8000000){alert('Wybierz zdjęcie JPG, PNG lub WebP o wielkości do 8 MB.');return}const u=URL.createObjectURL(f),pic=new Image();pic.onload=()=>{try{const cnv=document.createElement('canvas'),scale=Math.min(1,360/Math.max(pic.width,pic.height));cnv.width=Math.max(1,Math.round(pic.width*scale));cnv.height=Math.max(1,Math.round(pic.height*scale));cnv.getContext('2d').drawImage(pic,0,0,cnv.width,cnv.height);ui.draft.imageData=cnv.toDataURL('image/jpeg',0.75);const q=document.getElementById('reward-img-preview');if(q)q.textContent='✓ Zdjęcie dodane do nagrody. Zapisz nagrodę.';}catch(e){alert('Nie udało się odczytać zdjęcia.')}finally{URL.revokeObjectURL(u)}};pic.onerror=()=>{URL.revokeObjectURL(u);alert('Nie udało się otworzyć zdjęcia.')};pic.src=u;}return}if(el.hasAttribute('data-coupon')){ui.selectedCodes=el.checked?[...new Set([...ui.selectedCodes,el.dataset.coupon])]:ui.selectedCodes.filter(x=>x!==el.dataset.coupon);updatePreview()}if(el.hasAttribute('data-draft-check')&&ui.draft)ui.draft[el.dataset.draftCheck]=el.checked;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-go]'))go(e.target.dataset.go)});
render();
