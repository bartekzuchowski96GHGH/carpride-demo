/* v3 · Light, high-contrast customer screens. Dark home and admin stay untouched. */
.brand-image{display:none}
body.customer-light{--bg:#f2f4f7;--surface:#fff;--surface2:#f7f8fa;--border:#d4dae2;--red:#df1028;--red2:#c51b2d;--txt:#1a2130;--muted:#697281;--green:#148154;--gold:#a57a28;--warn:#a2620d;background:var(--bg);color:var(--txt)}
body.customer-light main{max-width:670px;padding:17px 16px 112px}
body.customer-light header{padding:4px 0 0;margin:0 0 23px;gap:8px}
body.customer-light .brand-text{display:none}
body.customer-light .brand-image{display:block;width:180px;height:87px;object-fit:contain;object-position:left center}
body.customer-light header .sub{letter-spacing:1.45px;font-size:9px;color:#656e7c;max-width:175px}
body.customer-light header .tag{background:#fff;border:1.5px solid #e11930;color:#c7192c;border-radius:12px;font-size:10px;padding:8px 9px;line-height:1.1;white-space:nowrap}
body.customer-light .nav{background:#fffffff7;border-top:1px solid #dce1e8;box-shadow:0 -5px 22px #27344b10}
body.customer-light .nav button{color:#737d8b}
body.customer-light .nav button.active{color:#d20b27}
body.customer-light .demo-stamp{border-color:#dfc2c5;color:#95515a;background:#fff}
body.customer-light .foot{color:#89929e}
body.customer-light .panel{background:white;border-color:#d7dee7;box-shadow:0 5px 16px #1a29450b}
body.customer-light .fine,body.customer-light .muted,body.customer-light .tier-range{color:#717b88}
body.customer-light .secondary{background:#fff;color:#242f3d;border-color:#cdd4df}
body.customer-light .primary{background:#df1028;border-color:#df1028;color:white}
body.customer-light .notice{background:#fff;color:#555f6d;border-color:#d9dfe8}
body.customer-light .chip{color:#bb2838;background:#fff0f1;border-color:#f0cbd2}
body.customer-light .chip.gray{color:#5b6572;background:#f4f5f7;border-color:#dce0e6}
body.customer-light .chip.gold{color:#9d601b;background:#fff4e4;border-color:#f0dbb7}
body.customer-light .chip.green{color:#14774d;background:#ecfaf3;border-color:#bfead7}
body.customer-light .history-row{border-color:#e3e7ed}
body.customer-light .empty{color:#7d8792;border-color:#cfd7e1}
body.customer-light .page-intro{color:#687380}
body.customer-light .label{color:#7a8390}
body.customer-light .qr{border:1px solid #e8ebef;box-shadow:0 4px 22px #10254117}
body.customer-light .reward-card{background:#fff}
body.customer-light .notice.redish{background:#fff6f6;color:#982d39;border-color:#e9cdd0}
.v3-screen{color:#1a2130}

"QRPolynomial":function(module,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

            case QRMode.MODE_8BIT_BYTE  : return 16;

            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;

        var row = 0; 
        var col = 0;

        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

		buffer.put(0, 4);
	}

		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

QRCode.createBytes = function(buffer, rsBlocks) {

	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {

			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {

function rewardDetails(r,left,limit){
 let out='';
 if(r.perAccount==='lifetime')out+=`<span class="v3-rule"><span class="v3-rule-symbol">♙</span>1 szt. na konto</span>`;
 if(r.perAccount==='period')out+=`<span class="v3-rule"><span class="v3-rule-symbol">♙</span>${esc(r.limitCount)} szt. na konto / ${esc(r.limitDays)} dni</span>`;
 if(left!==null)out+=`<span class="v3-rule"><span class="v3-rule-symbol">◉</span>Limit globalny: ${r.globalLimit} szt. <b>· Pozostało ${left} z ${r.globalLimit}</b></span>`;
 return out;
}
function fishRewardPage(){const fish=fishBalance(),filter=ui.rewardFilter||'all';const visible=state.rewards.filter(r=>r.active&&!(r.perAccount==='lifetime'&&limitInfo(r).blocked)).filter(r=>filter==='all'||(filter==='voucher'&&r.kind==='voucher')||(filter==='product'&&r.kind==='product')||(filter==='bonus'&&r.kind==='bonus'));return `
 <div class="v3-screen v3-rewards-screen">
  <div class="v3-page-head"><div class="v3-top-title"><h1>Złowione ryby</h1><p>Wymieniaj ryby na nagrody i bony.</p></div><div class="v3-head-watermark" aria-hidden="true">🎣</div></div>
  <section class="v3-balance-card"><div class="v3-balance-content"><div class="v3-balance-side"><div class="v3-balance-fish" aria-hidden="true">${fishSvg(46)}</div><div><div class="v3-balance-label">Twoje saldo</div><div class="v3-balance-num">${numFmt.format(fish)}<span> ryb</span></div></div></div><div class="v3-balance-actions"><button class="v3-outline-button" data-go="moje-nagrody">Moje nagrody <span>›</span></button></div></div><div class="v3-balance-hint">1 ryba za każde pełne 10 zł na paragonie</div><div class="v3-balance-wave"></div></section>
  <div class="v3-filter-row" role="group" aria-label="Filtruj nagrody">${[['all','Wszystkie'],['voucher','Bony'],['product','Produkty'],['bonus','Bonusy']].map(([id,label])=>`<button type="button" class="v3-filter ${filter===id?'active':''}" data-filter="${id}" aria-pressed="${filter===id?'true':'false'}">${label}</button>`).join('')}</div>
  <div class="v3-reward-list">${visible.length?visible.map(r=>{const left=globalLeft(r),limit=limitInfo(r),enough=fish>=r.cost,blocked=limit.blocked||(left!==null&&left<=0),reason=limit.blocked?`Limit na konto wykorzystany${limit.expires?' · dostępna ponownie '+formatDate(limit.expires):''}`:left!==null&&left<=0?'Pula globalna wykorzystana':!enough?'Brakuje '+numFmt.format(r.cost-fish)+' ryb':'';return `<article class="v3-reward-item"><div class="v3-reward-main"><div class="v3-reward-art">${rewardArtwork(r)}</div><div class="v3-reward-text"><h3>${esc(r.title)}</h3><div class="v3-fish-tag"><span class="v3-fish-glyph">${fishSvg(22)}</span>${numFmt.format(r.cost)} ${r.cost===1?'ryba':'ryb'}</div><div class="v3-reward-details">${rewardDetails(r,left,limit)}</div></div></div><div class="v3-reward-bottom"><div class="v3-validity">${r.validDays===null?'Bez terminu ważności':'Ważność: '+r.validDays+' dni od wymiany'}</div><button class="v3-claim-button" data-action="claim" data-id="${esc(r.id)}" ${blocked||!enough?'disabled':''}>Wypuść ${numFmt.format(r.cost)} ${r.cost===1?'rybę':'ryb'} <span>›</span></button></div>${reason?`<div class="v3-unavailable">${esc(reason)}</div>`:''}</article>`}).join(''):'<div class="v3-empty-card">W tej kategorii nie ma teraz dostępnych nagród.</div>'}</div>
  <div class="v3-small-print">Wymiana zużywa ryby i miejsce w globalnej puli na stałe, nawet jeśli nagroda wygaśnie. Nagrody z limitem jednorazowym po wymianie znikają z katalogu, ale ich kody zostają w „Moich nagrodach”.</div>
 </div>`}
function myRewardsPage(){const arr=[...state.fishClaims].reverse();return `
 <div class="v3-screen v3-my-rewards-screen"><div class="v3-page-head"><div class="v3-top-title"><h1>Moje nagrody</h1><p>Tu znajdziesz swoje odebrane bony i kody QR.</p></div></div>
 <button class="v3-outline-button v3-back" data-go="nagrody">‹ &nbsp; Wróć do katalogu</button>
 <div class="v3-my-reward-list">${arr.length?arr.map(c=>{const status=claimStatus(c),date=expirationClaim(c);return `<article class="v3-box v3-owned-reward"><div class="v3-owned-header"><h3>${esc(c.title)}</h3><span class="v3-status ${status}">${readableClaimStatus(c)}</span></div><p class="v3-own-meta">Odebrana: ${formatDate(c.createdAt)} · ${numFmt.format(c.cost)} ryb</p><p class="v3-own-meta">${date?'Ważna do '+formatDate(date):'Bez terminu ważności'}</p>${status==='ready'?`${htmlQR(c.code)}<div class="v3-owned-code">${esc(c.code)}</div><p class="v3-own-help">Pokaż ten kod sprzedawcy przy kasie.</p><button class="v3-outline-button v3-copy-btn" data-action="copy" data-code="${esc(c.code)}">Kopiuj kod nagrody</button>`:`<div class="v3-owned-notice">${status==='used'?'Wykorzystana '+formatDate(c.usedAt):'Ta nagroda już wygasła'}. Wydane ryby nie wracają na konto.</div>`}</article>`}).join(''):'<div class="v3-empty-card">Nie masz jeszcze odebranych nagród. Przejdź do katalogu i wymień złowione ryby.</div>'}</div>
 </div>`}
function historiaPage(){const items=[];state.purchases.forEach(p=>{items.push({date:dateAt(p.date),html:`<div class="history-row"><div class="row"><span class="strong">🛒 Zakup stacjonarny <span class="fine">${esc(p.id)}</span></span><b class="success">+${pointsText(p.paid)}</b></div><div class="fine mt8">${formatDate(dateAt(p.date))} · zapłacono ${cash(p.paid)} · ważne do ${formatDate(expiryPurchase(p))}</div></div>`});if(p.refund>0)items.push({date:dateAt(p.refundDate||p.date),html:`<div class="history-row"><div class="row"><b>↩️ Zwrot zakupu ${esc(p.id)}</b><b class="error">−${pointsText(p.refund)}</b></div><div class="fine mt8">${formatDate(dateAt(p.refundDate||p.date))} · korekta po zwrocie</div></div>`});if(expiredPurchase(p)&&effectivePaid(p)>0)items.push({date:expiryPurchase(p),html:`<div class="history-row"><div class="row"><b>⌛ Wygaśnięcie punktów ${esc(p.id)}</b><b class="warning">−${pointsText(effectivePaid(p))}</b></div><div class="fine mt8">${formatDate(expiryPurchase(p))} · minęło 12 miesięcy od zakupu</div></div>`});});items.sort((a,b)=>b.date-a.date);return `${head('Historia punktów','Pełna historia punktów poziomu: zakupów, korekt za zwroty i wygaśnięć.')}
 <div class="panel row"><div class="label">AKTYWNE PUNKTY POZIOMU</div><b style="font-size:23px">${pointsText(tierPoints())}</b></div><div class="panel">${items.length?items.map(x=>x.html).join(''):'<div class="empty">Brak operacji.</div>'}</div><button class="secondary block" data-go="karta">← Wróć do mojej karty</button>`}

function checkout(){let R=Number(String(ui.saleRegular).replace(',','.')),M=Number(String(ui.salePromo).replace(',','.'));if(!Number.isFinite(R)||!Number.isFinite(M)||R<0||M<0||R+M<=0)return {error:'Wpisz poprawne kwoty produktów; suma musi być większa od zera.'};R=dec(R);M=dec(M);
 const codes=checkedVouchers();const V=dec(codes.reduce((s,c)=>s+c.value,0));const P=tierPoints();const ranked=[...state.tiers].reverse();let chosen=null,paid=0,discAmount=0;
 for(const tier of ranked){const disc=dec(R*tier.discount/100),total=dec(R+M-disc);const result=dec(total-V);if(result<0)continue;if(P+result+1e-8>=tier.min){chosen=tier;paid=result;discAmount=disc;break}}
 if(!chosen){const t=state.tiers[0];const d=dec(R*t.discount/100);if(dec(R+M-d)<V)return {error:'Wybrane bony przekraczają kwotę zakupów po rabacie. Odznacz część bonów.'};chosen=t;paid=dec(R+M-d-V);discAmount=d;}
 if(V>dec(R+M-discAmount))return {error:'Bony przekraczają kwotę do zapłaty.'};
 const earnedFish=Math.floor(cents(paid)/1000);const nextPoints=dec(P+paid);return {R,M,V,paid,points:paid,fish:earnedFish,discAmount,tier:chosen,before:tierByPoints(P),after:tierByPoints(nextPoints),codes};}

document.addEventListener('input',e=>{const el=e.target;if(el.dataset.sale==='regular'){ui.saleRegular=el.value;updatePreview()}if(el.dataset.sale==='promo'){ui.salePromo=el.value;updatePreview()}if(el.hasAttribute('data-lookup'))ui.lookup=el.value;if(el.hasAttribute('data-draft')&&ui.draft){const k=el.dataset.draft;ui.draft[k]=(k==='globalLimit'||k==='validDays')?(el.value===''?null:el.value):el.value;}});
document.addEventListener('change',e=>{const el=e.target;if(el.hasAttribute('data-reward-photo')){const f=el.files&&el.files[0];if(f&&ui.draft){if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>8000000){alert('Wybierz zdjęcie JPG, PNG lub WebP o wielkości do 8 MB.');return}const u=URL.createObjectURL(f),pic=new Image();pic.onload=()=>{try{const cnv=document.createElement('canvas'),scale=Math.min(1,360/Math.max(pic.width,pic.height));cnv.width=Math.max(1,Math.round(pic.width*scale));cnv.height=Math.max(1,Math.round(pic.height*scale));cnv.getContext('2d').drawImage(pic,0,0,cnv.width,cnv.height);ui.draft.imageData=cnv.toDataURL('image/jpeg',0.75);const q=document.getElementById('reward-img-preview');if(q)q.textContent='✓ Zdjęcie dodane do nagrody. Zapisz nagrodę.';}catch(e){alert('Nie udało się odczytać zdjęcia.')}finally{URL.revokeObjectURL(u)}};pic.onerror=()=>{URL.revokeObjectURL(u);alert('Nie udało się otworzyć zdjęcia.')};pic.src=u;}return}if(el.hasAttribute('data-coupon')){ui.selectedCodes=el.checked?[...new Set([...ui.selectedCodes,el.dataset.coupon])]:ui.selectedCodes.filter(x=>x!==el.dataset.coupon);updatePreview()}if(el.hasAttribute('data-draft-check')&&ui.draft)ui.draft[el.dataset.draftCheck]=el.checked;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-go]'))go(e.target.dataset.go)});
render();

</script>
</body></html>
